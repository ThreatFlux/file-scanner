# Configuration for cargo-deny
# See https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Add any advisory IDs to ignore here
    # paste crate unmaintained warning - not a security issue
    "RUSTSEC-2024-0436",
    # RSA timing attack - waiting for yara-x upstream fix
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "bzip2-1.0.6",
    "MPL-2.0",
]
exceptions = [
    # Allow specific packages with incompatible licenses if necessary
    # { allow = ["ISC"], name = "package-name" },
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = [
    # Add any specifically allowed crates here
]
deny = [
    # Add any specifically denied crates here
    # { name = "openssl", version = "*" },  # Example: prefer rustls
]
skip = [
    # Skip these crates from multiple-version checks
    { name = "windows_x86_64_msvc", version = "*" },
    { name = "windows_x86_64_gnu", version = "*" },
    { name = "windows_i686_msvc", version = "*" },
    { name = "hashbrown", version = "*" },
    { name = "gimli", version = "*" },
    { name = "object", version = "*" },
    { name = "zip", version = "*" },
    { name = "addr2line", version = "*" },
    { name = "zerovec-derive", version = "*" },
    { name = "zerovec", version = "*" },
    { name = "darling", version = "*" },
    { name = "darling_core", version = "*" },
    { name = "darling_macro", version = "*" },
    { name = "fallible-iterator", version = "*" },
    { name = "getrandom", version = "*" },
    { name = "yoke-derive", version = "*" },
]
skip-tree = [
    # Skip entire dependency trees
    # { name = "windows-sys", version = "*" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Add any allowed git sources here
    # "https://github.com/example/repo",
]