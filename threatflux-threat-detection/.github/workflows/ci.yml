name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run nightly tests to catch regressions
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

  CARGO_TARGET_DIR: ${{ github.workspace }}/threatflux-threat-detection/target
jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust:
          - 1.99.0
          - beta
          - nightly
        exclude:
          # Reduce matrix size for faster CI
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Verify selected Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}

          workspaces: threatflux-threat-detection -> target
      - name: Install YARA (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libyara-dev yara

      - name: Install YARA (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install yara

      - name: Install YARA (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Use vcpkg for YARA on Windows
          vcpkg install yara:x64-windows
        shell: cmd

      - name: Check formatting
        if: matrix.rust == '1.99.0'
        run: |
          cargo fmt --all -- --check


      - name: Run clippy
        if: matrix.rust == '1.99.0'
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings


      - name: Build library
        run: |
          cargo build --locked --verbose --all-features


      - name: Build without default features
        run: |
          cargo build --locked --verbose --no-default-features


      - name: Run tests (all features)
        run: |
          cargo test --locked --verbose --all-features


      - name: Run tests (no default features)
        run: |
          cargo test --locked --verbose --no-default-features


      - name: Run tests (feature combinations)
        run: |
          cargo test --locked --verbose --features "yara-engine"
          cargo test --locked --verbose --features "pattern-matching"
          cargo test --locked --verbose --features "async-scanning"
          cargo test --locked --verbose --features "serde"

      - name: Run doc tests
        run: |
          cargo test --locked --doc --all-features


  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          components: llvm-tools-preview

          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: threatflux-threat-detection -> target
      - name: Install YARA
        run: |
          sudo apt-get update
          sudo apt-get install -y libyara-dev yara

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0  # v2.87.24
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Generate code coverage
        run: |
          cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: threatflux-threat-detection/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

          version: v11.3.1
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: threatflux-threat-detection -> target
      - name: Install YARA
        run: |
          sudo apt-get update
          sudo apt-get install -y libyara-dev yara

      - name: Run benchmarks
        run: |
          # Note: Benchmarks are currently disabled in Cargo.toml
          # This will be enabled when benchmark files are implemented
          echo "Benchmarks will be enabled when benchmark files are implemented"
          # cargo bench --locked --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: threatflux-threat-detection -> target
      - name: Install cargo-audit
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0  # v2.87.24
        with:
          tool: cargo-audit@0.22.2

      - name: Run security audit
        run: |
          python3 ../scripts/check-rsa-exception.py
          (cd .. && cargo audit)


      - name: Run clippy security lints
        run: |
          cargo clippy --locked --all-features --all-targets -- \
            -W clippy::suspicious \
            -W clippy::complexity \
            -W clippy::perf \
            -W clippy::style \
            -W clippy::nursery

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust 1.97.1 (MSRV)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.97.1
      - name: Verify minimum Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: threatflux-threat-detection -> target
      - name: Install YARA
        run: |
          sudo apt-get update
          sudo apt-get install -y libyara-dev yara

      - name: Check MSRV
        run: |
          cargo check --locked --all-features


  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: threatflux-threat-detection -> target
      - name: Install YARA
        run: |
          sudo apt-get update
          sudo apt-get install -y libyara-dev yara

      - name: Create test malware samples (safe)
        run: |
          mkdir -p test-samples
          # Create EICAR test string (standard test file for antivirus)
          # The EICAR fixture is literal text.
          # shellcheck disable=SC2016
          echo 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > test-samples/eicar.txt
          # Create a simple YARA rule for testing
          cat > test-samples/test.yar << 'EOF'
          rule EICAR_Test {
              meta:
                  description = "Standard EICAR test file"
              strings:
                  $eicar = "EICAR-STANDARD-ANTIVIRUS-TEST-FILE"
              condition:
                  $eicar
          }
          EOF

      - name: Run integration tests with test samples
        run: |
          THREAT_DETECTION_TEST_SAMPLES="$(pwd)/test-samples"
          export THREAT_DETECTION_TEST_SAMPLES
          cargo test --locked --test integration_test --all-features

      - name: Clean up test samples
        run: |
          rm -rf test-samples
defaults:
  run:
    shell: bash
    working-directory: threatflux-threat-detection
