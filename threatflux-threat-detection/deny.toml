# cargo-deny configuration for ThreatFlux Threat Detection
# This file controls dependency license and security checking

[graph]
# The path where the output will be written to, this path is relative to `cwd` used by the command line.
targets = []

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# Root workspace policy is authoritative for this local workspace member.
# Keep only the root workspace's existing maintenance/public-verification exceptions.
# Existing RSA exemption: RUSTSEC-2023-0071 has no patched stable release.
# YARA-X uses RsaPublicKey/PKCS#1 signature verification only; it never loads
# private keys or invokes RSA signing/decryption (vendor source crypto.rs).
# Reassess this exemption if upstream or scanner usage adds private operations.
ignore = ["RUSTSEC-2025-0141", "RUSTSEC-2023-0071"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "BSL-1.0",
    "LGPL-2.1-or-later",
    "Zlib",
    "bzip2-1.0.6",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    # Allow specific packages with incompatible licenses if necessary
    # { allow = ["ISC"], name = "package-name" },
]
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
# * lowest-version - The path to the lowest versioned duplicate is highlighted
# * simplest-path - The path to the version with the fewest edges is highlighted
# * all - Both lowest-version and simplest-path are used
highlight = "all"
# List of crates that are allowed. Use with care!
allow = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
# List of crates to deny
deny = [
    # Each entry the name of a crate and a version range. If version is
    # not specified, all versions will be matched.
    #{ name = "ansi_term", version = "=0.11.0" },
    
    # Deny crates with known security issues (examples)
    { name = "openssl", version = "<0.10.45" },
    { name = "openssl-sys", version = "<0.9.75" },
]
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
# Similarly to `skip` allows you to skip certain crates from being checked. Unlike
# `skip`, a skipped crate is removed from the dependency graph entirely and so
# will not surface in tests or wildcards, and may itself not be checked, which
# is not suitable for all cases.
skip-tree = [
    #{ name = "ansi_term", version = "=0.11.0", depth = 20 },
]

[sources]
# Lint level for what to happen when a crate from a crate registry that is
# not in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "warn"
# List of allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of allowed Git repositories
allow-git = []