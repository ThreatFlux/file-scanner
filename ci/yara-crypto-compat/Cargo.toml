[package]
name = "file-scanner-yara-crypto-compat"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
logging = ["dep:log"]

[dependencies]
hex = "0.4.3"
const-oid = { version = "0.10.2", features = ["db"] }
der-parser = { version = "10.0.0", features = ["bigint"] }
digest = { version = "0.11.3" }
dsa = { version = "0.7.0" }
ecdsa = { version = "0.17.0" }
md2 = { version = "0.11.0", features = ["oid"] }
md-5 = { version = "0.11.0", features = ["oid"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = { version = "0.11.1", features = ["oid"] }
thiserror = { version = "2.0.21" }
x509-parser = { version = "0.18.1" }
log = { version = "0.4.34", optional = true }
