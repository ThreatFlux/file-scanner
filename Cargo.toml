[workspace]
resolver = "2"
members = [
    ".",
    # All ThreatFlux libraries have been migrated to crates.io
    # "threatflux-binary-analysis", # Migrated to crates.io v0.2.0
    # "threatflux-cache", # Migrated to crates.io v0.1.8
    # "threatflux-hashing", # Migrated to crates.io v0.1.8
    # "threatflux-package-security", # Not used in actual source code
    # "threatflux-string-analysis", # Migrated to crates.io v0.1.1
    # "threatflux-threat-detection", # Already disabled
]
exclude = ["threatflux-package-security"]

# Workspace-wide dependency specifications for consistency
[workspace.dependencies]
# Core Rust async and runtime
tokio = { version = "1.53.2", features = ["full"] }
async-trait = "0.1.92"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"

# CLI and configuration
clap = { version = "4.6.7", features = ["derive"] }

# File and system utilities
filetime = "0.2.29"
chrono = { version = "0.4.45", features = ["serde"] }
memmap2 = "0.9.11"
walkdir = "2.5.0"

# Hashing algorithms
sha2 = "0.11.0"
md-5 = "0.11.0"
blake3 = "1.8.7"

# String processing
regex = "1.13.1"
encoding_rs = "0.8.42"

# Binary parsing
goblin = "0.10.7"
object = "0.40.0"

# Cryptography and signatures
ring = "0.17.14"

# MCP SDK
rmcp = { version = "=3.5.0", features = ["transport-io"] }
schemars = "1.2.2"

# HTTP server
axum = { version = "0.8.9", features = ["ws"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
hyper = "1.11.1"
tokio-stream = "0.1.19"
futures-util = "0.3.34"
uuid = { version = "1.27.0", features = ["v4"] }

# OpenAPI documentation
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-redoc = { version = "7.0.0", features = ["axum"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }

# Static analysis
addr2line = "0.27.1"
capstone = "0.14.0"
petgraph = "0.8.3"

# Threat detection
yara-x = "1.21.0"

# Network and repository checks
strsim = "0.11.1"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
git2 = "0.21.0"
url = "2.5.8"
edit-distance = "2.2.2"

# Archive handling
cfb = "0.15.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = "0.4.46"

# XML and data processing
quick-xml = "0.42.0"
base64 = "0.23.1"

# Test dependencies
tempfile = "3.27.0"
mockall = "0.15.0"
proptest = "1.11.0"
rstest = "0.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
pretty_assertions = "1.4.1"
test-case = "3.4.0"
serial_test = "4.0.1"
predicates = "3.1.4"
assert_fs = "1.1.4"
assert_cmd = "2.2.2"
rand = "0.10.3"
libc = "0.2.190"
tokio-test = "0.4.6"
wiremock = "0.6.5"
once_cell = "1.21.4"

[workspace.metadata.docs]
# Workspace-wide documentation configuration
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.metadata.release]
# Release configuration for all workspace members
shared-version = true
tag-name = "v{{version}}"
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}" },
    { file = "CHANGELOG.md", search = "\\.\\.\\.HEAD", replace = "...{{tag_name}}" },
    { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}" },
]

# Main file-scanner package configuration
[package]
name = "file-scanner"
version = "0.3.5"
edition = "2021"
rust-version = "1.97.1"
authors = ["File Scanner Project <dev@threatflux.com>"]
description = "A comprehensive file analysis framework for security research, malware detection, and forensic investigation"
homepage = "https://github.com/ThreatFlux/file-scanner"
repository = "https://github.com/ThreatFlux/file-scanner"
license = "MIT"
readme = "README.md"
keywords = ["security", "malware", "forensics", "analysis", "file-scanner"]
categories = ["command-line-utilities", "development-tools", "security", "analysis"]


[dependencies]
# ThreatFlux libraries - migrated to crates.io
threatflux-hashing = { version = "1.7.0", features = ["serde"] }
threatflux-string-analysis = { version = "0.2.2" }
threatflux-cache = { version = "0.2.0" } # TODO: Update library to use utoipa 5.4.0 for openapi feature
threatflux-binary-analysis = { version = "0.3.0", features = ["serde-support"] }
# Enhanced threat detection with YARA integration and malware analysis (local workspace)
threatflux-threat-detection = { version = "0.1.0", path = "threatflux-threat-detection", features = ["builtin-rules", "pattern-matching", "serde", "async-scanning"] }
# threatflux-package-security = { version = "0.1.0" } # Not used in actual source code

# Core dependencies (using workspace versions)
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
filetime = { workspace = true }
chrono = { workspace = true }

# Hash calculations (temporary during migration)
sha2 = { workspace = true }
md-5 = { workspace = true }
blake3 = { workspace = true }

# Binary parsing
goblin = { workspace = true }
object = { workspace = true }

# String extraction
regex = { workspace = true }
encoding_rs = { workspace = true }

# Digital signature verification
ring = { workspace = true }

# MCP SDK
rmcp = { workspace = true }
schemars = { workspace = true }

# HTTP server for MCP
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }

# OpenAPI documentation
utoipa = { workspace = true }
utoipa-redoc = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# Static analysis dependencies
addr2line = { workspace = true }
memmap2 = { workspace = true }
capstone = { workspace = true }
petgraph = { workspace = true }

# Threat detection
yara-x = { workspace = true }
walkdir = { workspace = true }

# Network and repository analysis
strsim = { workspace = true }
reqwest = { workspace = true }
git2 = { workspace = true }
url = { workspace = true }
edit-distance = { workspace = true }

# Archive analysis
cfb = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }

# XML and data processing
quick-xml = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
criterion = { workspace = true }
pretty_assertions = { workspace = true }
test-case = { workspace = true }
serial_test = { workspace = true }
predicates = { workspace = true }
assert_fs = { workspace = true }
assert_cmd = { workspace = true }
rand = { workspace = true }
libc = { workspace = true }
tokio-test = { workspace = true }
reqwest = { workspace = true }
wiremock = { workspace = true }
once_cell = { workspace = true }

[[bench]]
name = "hash_benchmark"
harness = false

[[bench]]
name = "parser_benchmark"
harness = false

# Optimized profiles for different build scenarios
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.test]
opt-level = 2
debug = 1
incremental = true
codegen-units = 16

[profile.test-fast]
inherits = "test"
opt-level = 3
lto = "thin"

[profile.bench]
debug = 1
lto = "thin"
codegen-units = 1

[profile.dev]
incremental = true
debug = 2

# Temporary stable YARA-X patch: use the security-fixed stable Wasmtime runtime.
# Remove when published YARA-X resolves a patched Wasmtime release.
[patch.crates-io]
yara-x = { path = "vendor/yara-x-1.21.0" }
