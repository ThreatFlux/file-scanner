name: Security Audit

on:
  schedule:
    # Run every day at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

  CARGO_BUILD_JOBS: 2
jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2

      - name: Verify reviewed RSA exception conditions
        run: python3 scripts/check-rsa-exception.py
      - name: Run cargo audit
        run: |
          cargo audit
          cargo audit --file threatflux-package-security/Cargo.lock

      - name: Run cargo deny
        run: |
          cargo deny --locked --workspace --all-features check
          cargo deny --locked --manifest-path threatflux-package-security/Cargo.toml --config deny.toml --all-features check


  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['rust']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev
      - name: Build project
        run: |
          cargo build --workspace --release --all-features --locked
          cargo build --manifest-path threatflux-package-security/Cargo.toml --release --all-features --locked


      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{matrix.language}}"

  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.9
          cargo cyclonedx --all-features --format json --spec-version 1.5 --override-filename sbom
          cargo cyclonedx --manifest-path threatflux-package-security/Cargo.toml --all-features --format json --spec-version 1.5 --override-filename sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: '**/sbom.json'

          if-no-files-found: error
      - name: Validate SBOM
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          files = [p for p in Path('.').rglob('sbom.json') if 'target' not in p.parts and '.git' not in p.parts]
          assert files, 'No generated SBOMs'
          for path in files:
              doc = json.loads(path.read_text())
              assert doc['bomFormat'] == 'CycloneDX', path
              assert isinstance(doc['components'], list) and doc['components'], path
              print(f'{path}: {len(doc["components"])} components')
          PYCODE

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine scan strategy
        id: scan-strategy
        run: |
          if [ "${WORKFLOW_VALUE_0}" = "push" ] && [ "${WORKFLOW_VALUE_1}" = "refs/heads/${WORKFLOW_VALUE_2}" ]; then
            # For pushes to main branch, scan the last commit only
            {
              echo "strategy=single-commit"
              echo "base=$(git rev-parse HEAD~1)"
              echo "head=HEAD"
            } >> "$GITHUB_OUTPUT"
          elif [ "${WORKFLOW_VALUE_0}" = "pull_request" ]; then
            # For PRs, scan the difference
            {
              echo "strategy=diff"
              echo "base=${WORKFLOW_VALUE_3}"
              echo "head=${WORKFLOW_VALUE_4}"
            } >> "$GITHUB_OUTPUT"
          else
            # Fallback: scan current HEAD only
            {
              echo "strategy=single-commit"
              echo "base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
              echo "head=HEAD"
            } >> "$GITHUB_OUTPUT"
          fi

        env:
          WORKFLOW_VALUE_0: ${{ github.event_name }}
          WORKFLOW_VALUE_1: ${{ github.ref }}
          WORKFLOW_VALUE_2: ${{ github.event.repository.default_branch }}
          WORKFLOW_VALUE_3: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_VALUE_4: ${{ github.event.pull_request.head.sha }}
      - name: Report informational verified TruffleHog findings
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85  # v3.97.9
        with:
          path: ./
          base: ${{ steps.scan-strategy.outputs.base }}
          head: ${{ steps.scan-strategy.outputs.head }}
          extra_args: --log-level=2 --results=verified
          version: 3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
        continue-on-error: true

  semgrep-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Report informational Semgrep findings
        id: semgrep
        run: |
          python3 -m venv "${RUNNER_TEMP}/semgrep"
          "${RUNNER_TEMP}/semgrep/bin/python" -m pip install "semgrep==1.179.0"
          scan_status=0
          "${RUNNER_TEMP}/semgrep/bin/semgrep" scan --config p/security-audit --config p/secrets --config p/owasp-top-ten --config p/rust --error --json --output semgrep-results.json . || scan_status=$?
          if [ "$scan_status" -gt 1 ]; then exit "$scan_status"; fi
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          report = json.loads(Path('semgrep-results.json').read_text())
          assert isinstance(report.get('results'), list), 'Semgrep scan returned no results array'
          print(f"Informational Semgrep findings: {len(report['results'])}")
          PYCODE
      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: semgrep-results
          path: semgrep-results.json
        continue-on-error: true
defaults:
  run:
    shell: bash
