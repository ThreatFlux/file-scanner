name: Security Audit

on:
  schedule:
    # Run every day at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run cargo audit
        run: |
          for attempt in 1 2 3; do
            if cargo audit \
              --ignore RUSTSEC-2026-0085 \
              --ignore RUSTSEC-2026-0086 \
              --ignore RUSTSEC-2026-0087 \
              --ignore RUSTSEC-2026-0088 \
              --ignore RUSTSEC-2026-0089 \
              --ignore RUSTSEC-2026-0091 \
              --ignore RUSTSEC-2026-0092 \
              --ignore RUSTSEC-2026-0093 \
              --ignore RUSTSEC-2026-0094 \
              --ignore RUSTSEC-2026-0095 \
              --ignore RUSTSEC-2026-0096 \
              --ignore RUSTSEC-2026-0222; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Run cargo deny
        run: cargo deny check

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false
          allow-ghsas: GHSA-m9w2-8782-2946, GHSA-6wgr-89rj-399p, GHSA-jxhv-7h78-9775, GHSA-m758-wjhj-p3jq, GHSA-jhxm-h53p-jm7w, GHSA-q49f-xg75-m9xw, GHSA-f984-pcp8-v2p7, GHSA-394w-hwhg-8vgm, GHSA-qqfj-4vcm-26hv, GHSA-xx5w-cvp6-jv83, GHSA-hx6p-xpx3-jvvv

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['rust']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build project
        run: cargo build --release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{matrix.language}}"

  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx
          cargo cyclonedx --format json > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

      - name: Validate SBOM
        run: |
          # Skip external validation for now - the cargo-cyclonedx tool already validates during generation
          # The SBOM is generated successfully and uploaded as an artifact
          echo "SBOM generated successfully by cargo-cyclonedx"
          echo "SBOM size: $(wc -c < sbom.json) bytes"
          echo "SBOM preview:"
          head -20 sbom.json

          # Basic JSON validation
          if jq empty sbom.json 2>/dev/null; then
            echo "✓ SBOM is valid JSON"
          else
            echo "⚠ SBOM JSON validation failed, but continuing"
            exit 0
          fi

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine scan strategy
        id: scan-strategy
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            # For pushes to main branch, scan the last commit only
            {
              echo "strategy=single-commit"
              echo "base=$(git rev-parse HEAD~1)"
              echo "head=HEAD"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, scan the difference
            {
              echo "strategy=diff"
              echo "base=${{ github.event.pull_request.base.sha }}"
              echo "head=${{ github.event.pull_request.head.sha }}"
            } >> "$GITHUB_OUTPUT"
          else
            # Fallback: scan current HEAD only
            {
              echo "strategy=single-commit"
              echo "base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
              echo "head=HEAD"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ steps.scan-strategy.outputs.base }}
          head: ${{ steps.scan-strategy.outputs.head }}
          extra_args: --debug --only-verified
        continue-on-error: true

  semgrep-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Semgrep
        id: semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/rust
        continue-on-error: true

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-results
          path: semgrep-results.json
        continue-on-error: true
