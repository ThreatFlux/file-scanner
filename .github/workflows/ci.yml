name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

# Read-only by default; jobs request any additional scopes they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0  # Disable for CI to improve caching
  CARGO_NET_RETRY: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # RUSTFLAGS: "-C link-arg=-fuse-ld=lld"  # Disabled: lld not available in GitHub Actions by default
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse  # Faster registry updates

jobs:
  # First job to build and cache for other jobs
  build-cache:
    name: Build Cache
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space at start
        run: |
          bash scripts/cleanup-ci-disk.sh

      - name: Generate cache key
        id: cache-key
        run: |
          echo "key=${WORKFLOW_VALUE_0}-rust-1.99.0-cargo-${WORKFLOW_VALUE_1}-${WORKFLOW_VALUE_2}" >> "$GITHUB_OUTPUT"

        env:
          WORKFLOW_VALUE_0: ${{ runner.os }}
          WORKFLOW_VALUE_1: ${{ hashFiles('**/Cargo.lock') }}
          WORKFLOW_VALUE_2: ${{ hashFiles('**/Cargo.toml') }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          components: rustfmt, clippy

          toolchain: 1.99.0
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.18.0
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ steps.cache-key.outputs.key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: target-debug0-${{ steps.cache-key.outputs.key }}-build
          restore-keys: |
            target-debug0-${{ runner.os }}-rust-1.99.0-cargo-

      - name: Monitor disk space during build
        run: |
          echo "📊 Disk space before build:"
          df -h

      - name: Pre-build dependencies
        run: |
          # Preserve dependency artifacts so later checks can reuse them.
          cargo build --locked --all-features
          echo "📊 Disk space after debug build:"
          df -h

          cargo build --locked --release
          echo "📊 Disk space after release build:"
          df -h

          # Build test dependencies separately
          cargo test --workspace --all-features --locked --no-run

          echo "📊 Final disk space:"
          df -h

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          components: rustfmt, clippy

          toolchain: 1.99.0
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.18.0
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ needs.build-cache.outputs.cache-key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: target-debug0-${{ needs.build-cache.outputs.cache-key }}-build
          restore-keys: |
            target-debug0-${{ runner.os }}-rust-1.99.0-cargo-

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path threatflux-package-security/Cargo.toml --all -- --check


      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path threatflux-package-security/Cargo.toml --all-targets --all-features --locked -- -D warnings


  test:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: build-cache
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust:
          - 1.99.0
          - beta
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash scripts/cleanup-ci-disk.sh

      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install llvm pkg-config openssl
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Verify selected Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.18.0
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: target-debug0-${{ runner.os }}-${{ matrix.rust }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            target-debug0-${{ runner.os }}-${{ matrix.rust }}-cargo-build-
            target-debug0-${{ runner.os }}-

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh


      - name: Run fast unit tests
        run: |
          echo "📊 Disk space before tests:"
          df -h
          ./scripts/test-fast.sh

      - name: Run tests with all features
        run: |
          cargo test --workspace --all-features --locked --verbose --jobs 2
          cargo test --manifest-path threatflux-package-security/Cargo.toml --all-features --locked --jobs 2

      - name: Run doc tests
        run: |
          cargo test --workspace --all-features --locked --doc --verbose
          cargo test --manifest-path threatflux-package-security/Cargo.toml --all-features --locked --doc
          echo "📊 Final disk space:"
          df -h

      - name: Check isolated production feature configurations
        run: |
          cargo check -p threatflux-threat-detection --lib --no-default-features --locked
          cargo check -p threatflux-threat-detection --lib --no-default-features --features yara-engine --locked
          cargo check -p threatflux-threat-detection --lib --no-default-features --features pattern-matching --locked
      - name: Test isolated feature configurations
        run: |
          cargo test -p threatflux-threat-detection --no-default-features --locked
          cargo test -p threatflux-threat-detection --no-default-features --features yara-engine --locked
          cargo test -p threatflux-threat-detection --no-default-features --features pattern-matching --locked
          cargo test --manifest-path threatflux-package-security/Cargo.toml --no-default-features --locked
      - name: Build strict workspace and standalone documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --all-features --locked --no-deps
          cargo doc --manifest-path threatflux-package-security/Cargo.toml --all-features --locked --no-deps
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Maximize available disk space
        run: |
          bash scripts/cleanup-ci-disk.sh

      - name: Setup swap space
        run: |
          echo "📊 Current memory and swap:"
          free -h
          if sudo swapon --noheadings --show=NAME | grep -qx "/swapfile"; then
            echo "ℹ️ Existing /swapfile is already active; reusing it"
          else
            if [ -f /swapfile ]; then
              echo "ℹ️ Removing inactive pre-existing /swapfile before recreating it"
              sudo swapoff /swapfile || true
              sudo rm -f /swapfile
            fi
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          sudo swapon --show
          echo "📊 Memory and swap after setup:"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: 1.99.0
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.18.0
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ needs.build-cache.outputs.cache-key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: target-debug0-${{ needs.build-cache.outputs.cache-key }}-build
          restore-keys: |
            target-debug0-${{ runner.os }}-rust-1.99.0-cargo-

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh


      - name: Run comprehensive parallel tests
        run: |
          echo "📊 Disk space before tests:"
          df -h
          # Set lower parallelism to reduce memory/disk pressure
          export CARGO_BUILD_JOBS=2
          export RUST_TEST_THREADS=2
          ./scripts/test-parallel-ci.sh
          echo "📊 Disk space after tests:"
          df -h

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: build-cache
    permissions:
      contents: read
      id-token: write # OIDC token for the Codecov upload; no CODECOV_TOKEN secret.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Maximize available disk space
        run: |
          bash scripts/cleanup-ci-disk.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          components: llvm-tools-preview

          toolchain: 1.99.0
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.18.0
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ needs.build-cache.outputs.cache-key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: target-debug0-${{ needs.build-cache.outputs.cache-key }}-coverage
          restore-keys: |
            target-debug0-${{ needs.build-cache.outputs.cache-key }}-build
            target-debug0-${{ runner.os }}-rust-1.99.0-cargo-

      - name: Install cargo-llvm-cov (faster than tarpaulin)
        run: |
          cargo install cargo-llvm-cov --locked --version 0.9.1

      - name: Generate code coverage
        run: |
          echo "📊 Disk space before coverage:"
          df -h
          # Use llvm-cov which is much faster than tarpaulin
          # Reduce parallelism to save memory/disk
          export CARGO_BUILD_JOBS=2
          # Generate coverage for main package only, not entire workspace
          # This reduces memory usage and build time significantly
          cargo llvm-cov --locked --all-features --lib --bins --lcov --output-path lcov.info
          test -s lcov.info
          # Clean up immediately after
          rm -rf target/llvm-cov-target
          echo "📊 Disk space after coverage:"
          df -h
        timeout-minutes: 30

      - name: Preserve generated coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: file-scanner-lcov
          path: lcov.info
          if-no-files-found: error

      # Codecov authenticates the upload with this job's GitHub OIDC token
      # (id-token: write), so no CODECOV_TOKEN secret is read.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          use_oidc: true
          files: ./lcov.info
          fail_ci_if_error: false  # Don't fail on coverage upload issues

          version: v11.3.1
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: 1.99.0
      - name: Install cargo-audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2

      - name: Verify reviewed RSA exception conditions
        run: python3 scripts/check-rsa-exception.py
      - name: Verify reviewed CodeQL source conditions and guard tests
        run: make codeql-review-check
      - name: Run security audit
        run: |
          cargo audit
          cargo audit --file threatflux-package-security/Cargo.lock

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: build-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: 1.99.0
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.18.0
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ needs.build-cache.outputs.cache-key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: target-debug0-${{ needs.build-cache.outputs.cache-key }}-bench
          restore-keys: |
            target-debug0-${{ needs.build-cache.outputs.cache-key }}-build
            target-debug0-${{ runner.os }}-rust-1.99.0-cargo-

      - name: Run benchmarks
        run: |
          cargo bench --workspace --all-features --locked --no-run


  mcp-test:
    name: MCP Stdio Tests
    runs-on: ubuntu-latest
    needs: build-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: 1.99.0
      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: target-debug0-${{ needs.build-cache.outputs.cache-key }}-build
          restore-keys: |
            target-debug0-${{ runner.os }}-rust-1.99.0-cargo-

      - name: Build release binary
        run: |
          cargo build --release --all-features --locked

      - name: Test MCP initialize, tools and controlled analysis
        run: |
          python3 scripts/mcp-smoke.py target/release/file-scanner
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          version: v0.37.2
          # Download the pinned buildx release on every run instead of restoring
          # it from the Actions cache, which other refs can write to.
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          tags: file-scanner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
  msrv:
    name: Minimum Rust 1.97.1
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: 1.97.1
      - name: Verify minimum Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Check all targets at the declared MSRV
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo check --manifest-path threatflux-package-security/Cargo.toml --all-targets --all-features --locked
defaults:
  run:
    shell: bash
