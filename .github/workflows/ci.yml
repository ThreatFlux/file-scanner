name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0  # Disable for CI to improve caching
  CARGO_NET_RETRY: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # RUSTFLAGS: "-C link-arg=-fuse-ld=lld"  # Disabled: lld not available in GitHub Actions by default
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse  # Faster registry updates

jobs:
  # First job to build and cache for other jobs
  build-cache:
    name: Build Cache
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free disk space at start
        run: |
          echo "📊 Initial disk space:"
          df -h
          echo "📦 Removing unnecessary packages and tools..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/share/kotlinc
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/share/gradle-*
          sudo rm -rf /usr/share/apache-maven-*
          sudo rm -rf /usr/share/sbt
          sudo apt-get clean
          sudo docker system prune -af
          echo "📊 Disk space after cleanup:"
          df -h

      - name: Generate cache key
        id: cache-key
        run: |
          echo "key=${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ steps.cache-key.outputs.key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target
          key: ${{ steps.cache-key.outputs.key }}-build
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Monitor disk space during build
        run: |
          echo "📊 Disk space before build:"
          df -h

      - name: Pre-build dependencies
        run: |
          # Build incrementally to manage disk space
          cargo build --all-features
          echo "📊 Disk space after debug build:"
          df -h

          # Clean up debug artifacts before release build
          rm -rf target/debug/deps/*.rlib
          rm -rf target/debug/incremental
          rm -rf target/debug/build

          cargo build --release
          echo "📊 Disk space after release build:"
          df -h

          # Build test dependencies separately
          cargo test --no-run --all-features 2>&1 | head -100

          # Clean up test build artifacts not needed for caching
          find target -name "*.d" -delete
          find target -name "*.rmeta" -delete
          find target -name "*.rlib" -size +50M -delete

          echo "📊 Final disk space:"
          df -h

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build-cache
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ needs.build-cache.outputs.cache-key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target
          key: ${{ needs.build-cache.outputs.cache-key }}-build
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: build-cache
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free disk space (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "📊 Initial disk space:"
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          echo "📊 Disk space after cleanup:"
          df -h

      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install llvm pkg-config openssl
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-build-
            ${{ runner.os }}-cargo-build-

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run fast unit tests
        run: |
          echo "📊 Disk space before tests:"
          df -h
          ./scripts/test-fast.sh
          # Clean up test artifacts between test runs
          rm -rf target/debug/deps/*-*
          rm -rf target/debug/incremental

      - name: Run tests with all features
        run: |
          cargo test --all-features --verbose --jobs 2
          # Clean up after tests
          rm -rf target/debug/deps/*-*
          rm -rf target/debug/incremental

      - name: Run doc tests
        run: |
          cargo test --doc --verbose
          echo "📊 Final disk space:"
          df -h

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-cache
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Maximize available disk space
        run: |
          echo "📊 Initial disk space:"
          df -h
          echo "🧹 Removing unnecessary software..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/share/kotlinc
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/share/gradle-*
          sudo rm -rf /usr/share/apache-maven-*
          sudo rm -rf /usr/share/sbt
          sudo rm -rf /opt/az
          sudo rm -rf /usr/share/az_*
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/google
          sudo rm -rf /opt/pipx
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' 'azure-cli' 'google-chrome-stable' 'firefox' 'powershell' 'mono-devel' 'libgl1-mesa-dri' '^google-cloud-.*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker system prune -af
          echo "📊 Disk space after cleanup:"
          df -h

      - name: Setup swap space
        run: |
          echo "📊 Current memory and swap:"
          free -h
          if sudo swapon --noheadings --show=NAME | grep -qx "/swapfile"; then
            echo "ℹ️ Existing /swapfile is already active; reusing it"
          else
            if [ -f /swapfile ]; then
              echo "ℹ️ Removing inactive pre-existing /swapfile before recreating it"
              sudo swapoff /swapfile || true
              sudo rm -f /swapfile
            fi
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          sudo swapon --show
          echo "📊 Memory and swap after setup:"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ needs.build-cache.outputs.cache-key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target
          key: ${{ needs.build-cache.outputs.cache-key }}-build
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Clean build artifacts before tests
        run: |
          echo "🧹 Cleaning build artifacts to save space..."
          # Remove debug symbols and incremental compilation artifacts
          rm -rf target/debug/deps/*.pdb
          rm -rf target/debug/deps/*.dSYM
          rm -rf target/debug/incremental
          rm -rf target/release/deps/*.pdb
          rm -rf target/release/deps/*.dSYM
          rm -rf target/release/incremental
          # Remove large rlib files we don't need for tests when the cache restored a target dir.
          if [ -d target ]; then
            find target -name "*.rlib" -size +30M -delete
          else
            echo "No target directory to clean"
          fi
          echo "📊 Disk space after artifact cleanup:"
          df -h

      - name: Run comprehensive parallel tests
        run: |
          echo "📊 Disk space before tests:"
          df -h
          # Set lower parallelism to reduce memory/disk pressure
          export CARGO_BUILD_JOBS=2
          export RUST_TEST_THREADS=2
          ./scripts/test-parallel-ci.sh
          echo "📊 Disk space after tests:"
          df -h

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: build-cache
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Maximize available disk space
        run: |
          echo "📊 Initial disk space:"
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/share/kotlinc
          sudo rm -rf /usr/local/go
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker system prune -af
          echo "📊 Disk space after cleanup:"
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ needs.build-cache.outputs.cache-key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target
          key: ${{ needs.build-cache.outputs.cache-key }}-coverage
          restore-keys: |
            ${{ needs.build-cache.outputs.cache-key }}-build
            ${{ runner.os }}-cargo-build-

      - name: Cache coverage tools
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-coverage-tools-v2
          restore-keys: |
            ${{ runner.os }}-coverage-tools-

      - name: Install cargo-llvm-cov (faster than tarpaulin)
        run: |
          if ! command -v cargo-llvm-cov &> /dev/null; then
            cargo install cargo-llvm-cov --locked
          fi

      - name: Generate code coverage
        run: |
          echo "📊 Disk space before coverage:"
          df -h
          # Use llvm-cov which is much faster than tarpaulin
          # Reduce parallelism to save memory/disk
          export CARGO_BUILD_JOBS=2
          # Generate coverage for main package only, not entire workspace
          # This reduces memory usage and build time significantly
          cargo llvm-cov --all-features --lib --bins --lcov --output-path lcov.info
          # Clean up immediately after
          rm -rf target/llvm-cov-target
          echo "📊 Disk space after coverage:"
          df -h
        timeout-minutes: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false  # Don't fail on coverage upload issues

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache cargo-audit
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v2
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi

      - name: Run security audit
        run: |
          for attempt in 1 2 3; do
            if cargo audit \
              --ignore RUSTSEC-2026-0085 \
              --ignore RUSTSEC-2026-0086 \
              --ignore RUSTSEC-2026-0087 \
              --ignore RUSTSEC-2026-0088 \
              --ignore RUSTSEC-2026-0089 \
              --ignore RUSTSEC-2026-0091 \
              --ignore RUSTSEC-2026-0092 \
              --ignore RUSTSEC-2026-0093 \
              --ignore RUSTSEC-2026-0094 \
              --ignore RUSTSEC-2026-0095 \
              --ignore RUSTSEC-2026-0096 \
              --ignore RUSTSEC-2026-0222; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: build-cache
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ needs.build-cache.outputs.cache-key }}-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target
          key: ${{ needs.build-cache.outputs.cache-key }}-bench
          restore-keys: |
            ${{ needs.build-cache.outputs.cache-key }}-build
            ${{ runner.os }}-cargo-build-

      - name: Run benchmarks
        run: cargo bench --no-run

  mcp-test:
    name: MCP Inspector Tests
    runs-on: ubuntu-latest
    needs: build-cache
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Cache npm packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mcp-v1
          restore-keys: |
            ${{ runner.os }}-npm-mcp-
            ${{ runner.os }}-npm-

      - name: Install MCP Inspector
        run: npm install -g @modelcontextprotocol/inspector

      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target
          key: ${{ needs.build-cache.outputs.cache-key }}-build
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release binary (if not cached)
        run: |
          if [ ! -f "./target/release/file-scanner" ]; then
            cargo build --release
          fi

      - name: Test MCP tools list
        run: |
          timeout 10s npx @modelcontextprotocol/inspector --cli ./target/release/file-scanner mcp-stdio --method tools/list

      - name: Test MCP with test file
        run: |
          echo "Test content" > /tmp/test.txt
          timeout 10s npx @modelcontextprotocol/inspector --cli ./target/release/file-scanner mcp-stdio --method tools/call --tool-name analyze_file --tool-arg file_path=/tmp/test.txt --tool-arg metadata=true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: file-scanner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
