name: Performance Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run benchmarks weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev jq bc

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Build release binary for benchmarking
        run: |
          cargo build --locked --release --all-features

      - name: Compile benchmarks for PRs
        if: github.event_name == 'pull_request'
        run: |
          cargo bench --locked --all-features --no-run


      - name: Run benchmarks
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          cargo bench --all-features --locked 2>&1 | tee benchmark_output.txt
          python3 - <<'PYCODE'
          import json, math
          from pathlib import Path
          root = Path('target/criterion')
          results = []
          for path in sorted(root.glob('**/new/estimates.json')):
              mean = json.loads(path.read_text())['mean']['point_estimate']
              assert isinstance(mean, (int, float)) and math.isfinite(mean) and mean >= 0, path
              results.append({'name': str(path.parent.parent.relative_to(root)), 'value': mean, 'unit': 'ns'})
          assert results, 'Criterion produced no benchmark measurements'
          Path('benchmark_results.json').write_text(json.dumps(results, indent=2) + '\n')
          PYCODE

      - name: Prepare for benchmark storage
        if: github.event_name != 'pull_request'
        run: |
          # Save benchmark results to a safe location
          cp benchmark_results.json /tmp/benchmark_results.json

          # Clean any uncommitted changes that might interfere with gh-pages switch
          git reset --hard HEAD
          git clean -fd

          # Restore benchmark results
          cp /tmp/benchmark_results.json benchmark_results.json

      - name: Store benchmark result
        if: github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: Rust Benchmark
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-threshold: '200%'
          fail-on-alert: false

      - name: Performance test with real files
        run: |
          echo "Testing performance with various file types..."

          # Create test files of different sizes
          dd if=/dev/zero of=test_1kb.bin bs=1024 count=1
          dd if=/dev/zero of=test_1mb.bin bs=1048576 count=1
          dd if=/dev/zero of=test_10mb.bin bs=1048576 count=10

          # Full disassembly reports can produce hundreds of MB of console logs.
          scan_report="$RUNNER_TEMP/file-scanner-performance-report.txt"
          for scan_input in test_1kb.bin test_1mb.bin test_10mb.bin /bin/ls; do
            printf 'Performance scan: %s\n' "$scan_input"
            time ./target/release/file-scanner "$scan_input" --all > "$scan_report"
            test -s "$scan_report"
            rm "$scan_report"
          done

      - name: Memory usage test
        run: |
          echo "Testing memory usage..."

          # Install memory profiling tool
          sudo apt-get install -y time

          # Test memory usage with different file sizes
          echo "=== Memory usage for 1MB file ==="
          /usr/bin/time -v ./target/release/file-scanner test_1mb.bin --all 2>&1 | grep -E "Maximum resident set size|User time|System time"

          echo "=== Memory usage for 10MB file ==="
          /usr/bin/time -v ./target/release/file-scanner test_10mb.bin --all 2>&1 | grep -E "Maximum resident set size|User time|System time"

    permissions:
      contents: write
  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build debug binary for profiling
        run: |
          cargo build --locked --all-features

      - name: Run memory leak check
        run: |
          echo "Test content" > test_file.txt
          valgrind --tool=memcheck --leak-check=full --show-leak-kinds=all --error-exitcode=1 \
            --track-origins=yes --verbose --log-file=valgrind-output.txt \
            ./target/debug/file-scanner test_file.txt --format json

      - name: Upload Valgrind results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: valgrind-results
          path: valgrind-output.txt

        if: always()
  compile-time-benchmark:
    name: Compile Time Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Clean build timing
        run: |
          echo "=== Clean build timing ==="
          time cargo build --locked --release --all-features

      - name: Incremental build timing
        run: |
          echo "=== Incremental build timing ==="
          touch src/main.rs
          time cargo build --locked --release --all-features

      - name: Test compilation timing
        run: |
          echo "=== Test compilation timing ==="
          time cargo test --locked --all-features --no-run
defaults:
  run:
    shell: bash
