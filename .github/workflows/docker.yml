name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "src/**"
      - "benches/**"
      - "threatflux-threat-detection/**"
      - vendor/**
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "src/**"
      - "benches/**"
      - "threatflux-threat-detection/**"
      - vendor/**
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  BINARY_NAME: file-scanner
  BINARY_PACKAGE: file-scanner
  SBOM_MANIFEST_PATH: Cargo.toml
  OCI_IMAGE_TITLE: File Scanner
  OCI_IMAGE_DESCRIPTION: Comprehensive native file scanner with MCP server support
  OCI_IMAGE_VENDOR: ThreatFlux
  OCI_IMAGE_SOURCE: https://github.com/ThreatFlux/file-scanner

jobs:
  build:
    name: Build Docker Image
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.lowercase.outputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Lowercase image name
        id: lowercase
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"


      - name: Detect Rust toolchain version
        id: rust_toolchain
        run: |
          TOOLCHAIN_VERSION="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml | sed -n '1p')"
          echo "version=${TOOLCHAIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Select build platforms
        id: platforms
        run: |
          {
            echo "value=linux/amd64,linux/arm64"
            echo "needs_qemu=true"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.platforms.outputs.needs_qemu == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract runtime metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ env.OCI_IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.OCI_IMAGE_DESCRIPTION }}
            org.opencontainers.image.authors=Wyatt Roersma <wyattroersma@gmail.com>
            org.opencontainers.image.source=${{ env.OCI_IMAGE_SOURCE }}
            org.opencontainers.image.licenses=MIT

      - name: Extract base image metadata
        id: base_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          tags: |
            type=raw,value=base-rust-${{ steps.rust_toolchain.outputs.version }}
            type=raw,value=base-rust-latest,enable={{is_default_branch}}

      - name: Build base image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: rust-base
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Build and export runtime image (PRs)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.lowercase.outputs.image_name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Build and push runtime image (non-PR)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Load runtime image (PRs)
        if: github.event_name == 'pull_request'
        run: |
          docker load -i /tmp/image.tar


      - name: Get short SHA
        id: sha
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      - name: Pull runtime image (non-PR)
        if: github.event_name != 'pull_request'
        run: |
          docker pull "${WORKFLOW_VALUE_0}/${WORKFLOW_VALUE_1}:${WORKFLOW_VALUE_2}"


        env:
          WORKFLOW_VALUE_0: ${{ env.REGISTRY }}
          WORKFLOW_VALUE_1: ${{ steps.lowercase.outputs.image_name }}
          WORKFLOW_VALUE_2: ${{ steps.sha.outputs.short }}
      - name: Test runtime image
        env:
          IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('{0}:scan', steps.lowercase.outputs.image_name) || format('{0}/{1}:{2}', env.REGISTRY, steps.lowercase.outputs.image_name, steps.sha.outputs.short) }}
        run: |
          docker run --rm "${IMAGE_TAG}" --help
          echo "Test Docker content" > test-file.txt
          docker run --rm -v "${PWD}:/data:ro" "${IMAGE_TAG}" /data/test-file.txt --format json
          timeout 10s docker run --rm "${IMAGE_TAG}" mcp-stdio < /dev/null

      - name: Upload image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  scan:
    name: Security Scan
    needs: build
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download image (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Load image (PRs)
        if: github.event_name == 'pull_request'
        run: |
          docker load -i /tmp/image.tar


      - name: Get short SHA
        id: sha
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        if: github.event_name != 'pull_request'
        run: |
          docker pull "${WORKFLOW_VALUE_0}/${WORKFLOW_VALUE_1}:${WORKFLOW_VALUE_2}"


        env:
          WORKFLOW_VALUE_0: ${{ env.REGISTRY }}
          WORKFLOW_VALUE_1: ${{ needs.build.outputs.image_name }}
          WORKFLOW_VALUE_2: ${{ steps.sha.outputs.short }}
      - name: Report informational Trivy findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}:scan', needs.build.outputs.image_name) || format('{0}/{1}:{2}', env.REGISTRY, needs.build.outputs.image_name, steps.sha.outputs.short) }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          vuln-type: os,library
          version: v0.75.0
          exit-code: '0'
      - name: Verify completed Trivy SARIF report
        if: always()
        run: |
          test -s trivy-results.sarif
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          report = json.loads(Path('trivy-results.sarif').read_text())
          assert report.get('version') == '2.1.0' and isinstance(report.get('runs'), list)
          PYCODE
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: trivy-results.sarif
        if: always() && hashFiles('trivy-results.sarif') != ''

  sign:
    name: Sign Container
    needs: [build, scan]
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        run: |
          cosign sign --yes "${WORKFLOW_VALUE_0}/${WORKFLOW_VALUE_1}@${WORKFLOW_VALUE_2}"
        env:
          COSIGN_EXPERIMENTAL: 1

          WORKFLOW_VALUE_0: ${{ env.REGISTRY }}
          WORKFLOW_VALUE_1: ${{ needs.build.outputs.image_name }}
          WORKFLOW_VALUE_2: ${{ needs.build.outputs.digest }}
  cleanup:
    name: Cleanup Old Images
    needs: build
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - name: Delete old container images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55  # v5.0.0
        with:
          package-name: file-scanner
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
defaults:
  run:
    shell: bash
