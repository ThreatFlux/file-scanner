name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "scripts/check-container-scan.py"
      - "scripts/check-native-zlib.py"
      - "scripts/test_container_scan.py"
      - "src/**"
      - "benches/**"
      - vendor/**
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "scripts/check-container-scan.py"
      - "scripts/check-native-zlib.py"
      - "scripts/test_container_scan.py"
      - "src/**"
      - "benches/**"
      - vendor/**
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Read-only by default; jobs request any additional scopes they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  BINARY_NAME: file-scanner
  BINARY_PACKAGE: threatflux-file-scanner
  SBOM_MANIFEST_PATH: Cargo.toml
  OCI_IMAGE_TITLE: File Scanner
  OCI_IMAGE_DESCRIPTION: Comprehensive native file scanner with MCP server support
  OCI_IMAGE_VENDOR: ThreatFlux
  OCI_IMAGE_SOURCE: https://github.com/ThreatFlux/file-scanner

jobs:
  # There is deliberately no image cleanup job. GHCR lists the per-platform
  # images and attestation manifests of a multi-arch index as untagged package
  # versions, so pruning untagged versions (actions/delete-package-versions with
  # delete-only-untagged-versions) deleted the linux/amd64 and linux/arm64
  # images behind released tags: 0.3.4 and 0.3.5 still resolve to an index whose
  # children are gone, so they cannot be pulled. Public GHCR storage is free.
  build:
    name: Build Docker Image
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.lowercase.outputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lowercase image name
        id: lowercase
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"


      - name: Detect Rust toolchain version
        id: rust_toolchain
        run: |
          TOOLCHAIN_VERSION="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml | sed -n '1p')"
          echo "version=${TOOLCHAIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Select build platforms
        id: platforms
        run: |
          {
            echo "value=linux/amd64,linux/arm64"
            echo "needs_qemu=true"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.platforms.outputs.needs_qemu == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          version: v0.38.1
          # Download the pinned buildx release on every run instead of restoring
          # it from the Actions cache, which other refs can write to.
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract runtime metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ env.OCI_IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.OCI_IMAGE_DESCRIPTION }}
            org.opencontainers.image.authors=Wyatt Roersma <wyattroersma@gmail.com>
            org.opencontainers.image.source=${{ env.OCI_IMAGE_SOURCE }}
            org.opencontainers.image.licenses=MIT

      - name: Extract base image metadata
        id: base_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          tags: |
            type=raw,value=base-rust-${{ steps.rust_toolchain.outputs.version }}
            type=raw,value=base-rust-latest,enable={{is_default_branch}}

      - name: Build base image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: rust-base
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Build and export runtime image (PRs)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.lowercase.outputs.image_name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Build and push runtime image (non-PR)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Load runtime image (PRs)
        if: github.event_name == 'pull_request'
        run: |
          docker load -i /tmp/image.tar


      - name: Get short SHA
        id: sha
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      - name: Pull runtime image (non-PR)
        if: github.event_name != 'pull_request'
        run: |
          docker pull "${WORKFLOW_VALUE_0}/${WORKFLOW_VALUE_1}:${WORKFLOW_VALUE_2}"


        env:
          WORKFLOW_VALUE_0: ${{ env.REGISTRY }}
          WORKFLOW_VALUE_1: ${{ steps.lowercase.outputs.image_name }}
          WORKFLOW_VALUE_2: ${{ steps.sha.outputs.short }}
      - name: Test runtime image
        env:
          IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('{0}:scan', steps.lowercase.outputs.image_name) || format('{0}/{1}:{2}', env.REGISTRY, steps.lowercase.outputs.image_name, steps.sha.outputs.short) }}
        run: |
          docker run --rm "${IMAGE_TAG}" --help
          echo "Test Docker content" > test-file.txt
          docker run --rm -v "${PWD}:/data:ro" "${IMAGE_TAG}" /data/test-file.txt --format json
          timeout 10s docker run --rm "${IMAGE_TAG}" mcp-stdio < /dev/null

      - name: Upload image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  scan:
    name: Security Scan
    needs: build
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout scan validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download image (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: docker-image
          path: /tmp

      - name: Load image (PRs)
        if: github.event_name == 'pull_request'
        run: |
          docker load -i /tmp/image.tar


      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record exact image identity
        id: expected_image
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          IMAGE_REF: ${{ github.event_name == 'pull_request' && format('{0}:scan', needs.build.outputs.image_name) || format('{0}/{1}@{2}', env.REGISTRY, needs.build.outputs.image_name, needs.build.outputs.digest) }}
        run: |
          printf 'reference=%s\n' "${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          if [ "${IS_PULL_REQUEST}" = true ]; then
            image_id="$(docker image inspect "${IMAGE_REF}" --format '{{.Id}}')"
            printf 'image_id=%s\n' "${image_id}" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan every vulnerability severity on amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: ${{ github.event_name == 'pull_request' && 'docker' || 'remote' }}
          TRIVY_IGNOREFILE: /dev/null
        with:
          image-ref: ${{ steps.expected_image.outputs.reference }}
          format: json
          output: trivy-results.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: 'true'
          ignore-unfixed: 'false'
          version: v0.76.0
          cache-dir: .cache/trivy
          # Preserve/upload the full report before the explicit gate below.
          exit-code: '0'
      - name: Validate amd64 scan and convert complete SARIF
        if: always()
        env:
          EXPECTED_IMAGE_ID: ${{ steps.expected_image.outputs.image_id }}
          IMAGE_REF: ${{ steps.expected_image.outputs.reference }}
        run: |
          identity=(--reference "${IMAGE_REF}")
          if [ -n "${EXPECTED_IMAGE_ID}" ]; then
            identity=(--image-id "${EXPECTED_IMAGE_ID}")
          fi
          python3 scripts/check-container-scan.py --architecture amd64 "${identity[@]}" --validate-only trivy-results.json
          trivy convert --format sarif --output trivy-results.sarif trivy-results.json
          cp .cache/trivy/db/metadata.json trivy-db-metadata.json
          trivy --version > trivy-version.txt
      - name: Upload amd64 Trivy results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          # Preserve the existing main analysis identity so resolved alerts close.
          category: .github/workflows/docker.yml:scan
        if: always() && hashFiles('trivy-results.sarif') != ''
      - name: Scan published arm64 image at every severity
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ format('{0}/{1}@{2}', env.REGISTRY, needs.build.outputs.image_name, needs.build.outputs.digest) }}
          TRIVY_CACHE_DIR: .cache/trivy
        run: |
          trivy image --image-src remote --platform linux/arm64 --scanners vuln \
            --pkg-types os,library --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignorefile /dev/null --list-all-pkgs --format json \
            --output trivy-results-arm64.json "${IMAGE_REF}"
          python3 scripts/check-container-scan.py --architecture arm64 --reference "${IMAGE_REF}" --validate-only trivy-results-arm64.json
          trivy convert --format sarif --output trivy-results-arm64.sarif trivy-results-arm64.json
      - name: Upload arm64 Trivy results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: trivy-results-arm64.sarif
          category: .github/workflows/docker.yml:scan-arm64
        if: always() && hashFiles('trivy-results-arm64.sarif') != ''
      - name: Preserve complete scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: container-security-evidence
          path: |
            trivy-results*.json
            trivy-results*.sarif
            trivy-db-metadata.json
            trivy-version.txt
          if-no-files-found: error
      - name: Require zero container vulnerabilities at every severity
        env:
          REQUIRE_ARM64: ${{ github.event_name != 'pull_request' }}
          EXPECTED_IMAGE_ID: ${{ steps.expected_image.outputs.image_id }}
          IMAGE_REF: ${{ steps.expected_image.outputs.reference }}
        run: |
          identity=(--reference "${IMAGE_REF}")
          if [ -n "${EXPECTED_IMAGE_ID}" ]; then
            identity=(--image-id "${EXPECTED_IMAGE_ID}")
          fi
          python3 scripts/check-container-scan.py --architecture amd64 "${identity[@]}" trivy-results.json
          if [ "${REQUIRE_ARM64}" = true ]; then
            python3 scripts/check-container-scan.py --architecture arm64 --reference "${IMAGE_REF}" trivy-results-arm64.json
          fi

  sign:
    name: Sign Container
    needs: [build, scan]
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        run: |
          cosign sign --yes "${WORKFLOW_VALUE_0}/${WORKFLOW_VALUE_1}@${WORKFLOW_VALUE_2}"
        env:
          COSIGN_EXPERIMENTAL: 1

          WORKFLOW_VALUE_0: ${{ env.REGISTRY }}
          WORKFLOW_VALUE_1: ${{ needs.build.outputs.image_name }}
          WORKFLOW_VALUE_2: ${{ needs.build.outputs.digest }}
defaults:
  run:
    shell: bash
