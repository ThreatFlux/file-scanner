version: 2
multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: "cron"
      cronjob: "0 6 * * *"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
      include: "scope"

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly-dependencies"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly-dependencies"
    labels:
      - "ci/cd"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly-dependencies"
    labels:
      - "docker"
      - "infrastructure"
