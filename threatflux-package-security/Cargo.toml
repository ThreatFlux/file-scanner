[package]
name = "threatflux-package-security"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
authors = ["ThreatFlux"]
description = "Unified package security analysis framework for multiple package managers"
license = "MIT"
repository = "https://github.com/ThreatFlux/threatflux-package-security"
keywords = ["security", "vulnerability", "npm", "python", "java"]
categories = ["development-tools", "security"]

[workspace]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.2", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
once_cell = "1.21.4"
sha2 = "0.11.0"
hex = "0.4.3"
# Use the platform verifier to avoid bundling static webpki roots here.
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
tracing = "0.1.44"
strsim = "0.11.1"
async-trait = "0.1.92"
thiserror = "2.0.21"

# Package-specific dependencies
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }  # For Java archives
tar = "0.4.46"  # For Python packages
flate2 = "1.1.10"  # For compressed archives
toml = "1.1.6"  # For parsing pyproject.toml
dirs = "7.0.0"  # For finding cache directories

# Optional features
dashmap = { version = "6.2.1", optional = true }
parking_lot = { version = "0.12.5", optional = true }

[features]
default = ["concurrent"]
concurrent = ["dashmap", "parking_lot"]
offline = []  # Disable online vulnerability database updates

[dev-dependencies]
tempfile = "3.27.0"
pretty_assertions = "1.4.1"
tokio-test = "0.4.6"
mockito = "1.7.2"
