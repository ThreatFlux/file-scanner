[package]
name = "threatflux-package-security"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
authors = ["ThreatFlux"]
description = "Unified package security analysis framework for multiple package managers"
license = "MIT"
repository = "https://github.com/ThreatFlux/threatflux-package-security"
keywords = ["security", "vulnerability", "npm", "python", "java", "package-analysis"]
categories = ["development-tools", "security"]

[workspace]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.53", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
once_cell = "1.21"
sha2 = "0.11.0"
hex = "0.4"
# Use the platform verifier to avoid bundling static webpki roots here.
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
tracing = "0.1"
strsim = "0.11"
async-trait = "0.1"
thiserror = "2.0"

# Package-specific dependencies
zip = { version = "8.6", default-features = false, features = ["deflate"] }  # For Java archives
tar = "0.4"  # For Python packages
flate2 = "1.1"  # For compressed archives
toml = "1.1"  # For parsing pyproject.toml
dirs = "6.0"  # For finding cache directories

# Optional features
dashmap = { version = "6.2", optional = true }
parking_lot = { version = "0.12", optional = true }

[features]
default = ["concurrent"]
concurrent = ["dashmap", "parking_lot"]
offline = []  # Disable online vulnerability database updates

[dev-dependencies]
tempfile = "3.27"
pretty_assertions = "1.4"
tokio-test = "0.4"
mockito = "1.7"
