name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update to perform'
        required: true
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'all'
        default: 'patch'

env:
  CARGO_TERM_COLOR: always

  CARGO_TARGET_DIR: ${{ github.workspace }}/threatflux-package-security/target
permissions:
  contents: write
  pull-requests: write

jobs:
  # Check for outdated dependencies
  check-outdated:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      update_summary: ${{ steps.check.outputs.update_summary }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: dependency-check

          workspaces: threatflux-package-security -> target
      - name: Install cargo-outdated
        run: |
          cargo install cargo-outdated --locked --version 0.19.0


      - name: Check for outdated dependencies
        id: check
        run: |
          cargo outdated --format json > outdated.json
          cargo outdated > outdated.txt
          count=$(jq -e '.dependencies | length' outdated.json)
          {
            if [ "$count" -gt 0 ]; then echo 'has_updates=true'; else echo 'has_updates=false'; fi
            echo "update_summary=Found ${count} outdated dependencies"
          } >> "$GITHUB_OUTPUT"
          {
            echo '# Dependency Update Report'
            echo "Generated on: $(date)"
            echo "Found ${count} outdated dependencies"
            echo '```'
            cat outdated.txt
            echo '```'
          } > dependency-report.md

      - name: Upload dependency report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dependency-report
          path: |
            threatflux-package-security/dependency-report.md
            threatflux-package-security/outdated.json
            threatflux-package-security/outdated.txt
          retention-days: 30

  # Update Cargo dependencies
  update-cargo-deps:
    name: Update Cargo Dependencies
    needs: check-outdated
    runs-on: ubuntu-latest
    if: needs.check-outdated.outputs.has_updates == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: dependency-update

          workspaces: threatflux-package-security -> target
      - name: Install cargo-edit and cargo-update
        run: |
          cargo install cargo-edit --locked --version 0.13.13

      - name: Determine update strategy
        id: strategy
        run: |
          UPDATE_TYPE="${WORKFLOW_VALUE_0}"
          if [[ -z "$UPDATE_TYPE" ]]; then
            UPDATE_TYPE="patch"
          fi
          echo "update_type=$UPDATE_TYPE" >> "$GITHUB_OUTPUT"
          echo "Using update strategy: $UPDATE_TYPE"

        env:
          WORKFLOW_VALUE_0: ${{ github.event.inputs.update_type }}
      - name: Update dependencies (patch only)
        if: steps.strategy.outputs.update_type == 'patch'
        run: |
          # Update only patch versions (safest)
          cargo update

      - name: Update dependencies (minor versions)
        if: steps.strategy.outputs.update_type == 'minor'
        run: |
          cargo upgrade --compatible
          cargo update

      - name: Update dependencies (major versions)
        if: steps.strategy.outputs.update_type == 'major'
        run: |
          cargo upgrade --incompatible
          cargo update

      - name: Update dependencies (all)
        if: steps.strategy.outputs.update_type == 'all'
        run: |
          cargo upgrade --incompatible
          cargo update

      - name: Check if changes were made
        id: changes
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes made"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Dependency changes detected"
          fi

      - name: Run tests after update
        if: steps.changes.outputs.changes == 'true'
        run: |
          cargo check --all-features --locked
          cargo test --all-features --locked

      - name: Generate update summary
        if: steps.changes.outputs.changes == 'true'
        run: |
          {
            echo "# Dependency Update Summary"
            echo ""
            echo "**Update Type:** ${WORKFLOW_VALUE_0}"
            echo "**Date:** $(date)"
            echo ""
            echo "## Changes Made"
            echo '```diff'
            git diff -- Cargo.toml Cargo.lock
            echo '```'
            echo ""
            echo "## Verification"
            echo "- ✅ Cargo check passed"
            echo "- ✅ Full tests passed"
          } > update-summary.md

        env:
          WORKFLOW_VALUE_0: ${{ steps.strategy.outputs.update_type }}
      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(deps): update dependencies (${{ steps.strategy.outputs.update_type }})

            Automated dependency update using ${{ steps.strategy.outputs.update_type }} strategy.

            - Update type: ${{ steps.strategy.outputs.update_type }}
            - Generated by: dependency-update workflow
            - Date: ${{ github.run_id }}
          title: "chore(deps): Update dependencies (${{ steps.strategy.outputs.update_type }})"
          body: |
            ## 📦 Dependency Update

            This PR contains automated dependency updates using the **${{ steps.strategy.outputs.update_type }}** update strategy.

            ### Update Summary

            ${{ needs.check-outdated.outputs.update_summary }}

            ### Changes

            - **Update Type:** ${{ steps.strategy.outputs.update_type }}
            - **Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Triggered:** ${{ github.event_name }}

            ### Verification

            - ✅ `cargo check` passed
            - ✅ Full tests passed
            - ⏳ Full CI will run on this PR

            ### Review Checklist

            - [ ] Review the dependency changes
            - [ ] Ensure CI passes completely
            - [ ] Check for any breaking changes in major updates
            - [ ] Verify security audit still passes

            ---

            🤖 This PR was created automatically by the dependency update workflow.
          branch: "chore/dependency-update-${{ steps.strategy.outputs.update_type }}-${{ github.run_number }}"
          delete-branch: true
          labels: |
            dependencies
            automated
            ${{ steps.strategy.outputs.update_type }}-update

  # Security update check
          add-paths: |
            threatflux-package-security/Cargo.toml
            threatflux-package-security/Cargo.lock
  security-updates:
    name: Security-focused Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: security-updates

          workspaces: threatflux-package-security -> target
      - name: Install security tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-edit --locked --version 0.13.13

      - name: Check for security advisories
        run: |
          audit_status=0
          python3 ../scripts/check-rsa-exception.py
          cargo audit --json > security-advisories.json || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
          VULN_COUNT=$(jq -e '.vulnerabilities.list | length' security-advisories.json)
          {
            echo "VULN_COUNT=$VULN_COUNT"
            if [ "$VULN_COUNT" -gt 0 ]; then echo 'SECURITY_UPDATES_NEEDED=true'; else echo 'SECURITY_UPDATES_NEEDED=false'; fi
          } >> "$GITHUB_ENV"
          {
            echo '# Security Update Report'
            echo "Known vulnerabilities: $VULN_COUNT"
            jq -r '.vulnerabilities.list[] | "- \(.advisory.id): \(.advisory.title)"' security-advisories.json
          } > security-update-report.md

      - name: Attempt automatic security fixes
        if: env.SECURITY_UPDATES_NEEDED == 'true'
        run: |
          cargo update
          audit_status=0
          python3 ../scripts/check-rsa-exception.py
          cargo audit --json > security-advisories-after.json || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
          VULN_COUNT_AFTER=$(jq -e '.vulnerabilities.list | length' security-advisories-after.json)
          {
            echo "VULN_COUNT_AFTER=$VULN_COUNT_AFTER"
            if [ "$VULN_COUNT_AFTER" -lt "$VULN_COUNT" ]; then echo 'SECURITY_FIXES_APPLIED=true'; else echo 'SECURITY_FIXES_APPLIED=false'; fi
          } >> "$GITHUB_ENV"
          cargo test --all-features --locked

      - name: Create security update PR
        if: env.SECURITY_FIXES_APPLIED == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            security: update dependencies to fix vulnerabilities

            Automated security update to address known vulnerabilities.

            - Fixes security advisories
            - Generated by: dependency-update workflow
            - Priority: HIGH
          title: "🔒 SECURITY: Update dependencies to fix vulnerabilities"
          body: |
            ## 🔒 Security Update

            This PR contains **high-priority security updates** to fix known vulnerabilities.

            ### Security Summary

            - **Original vulnerabilities:** ${{ env.VULN_COUNT }}
            - **Remaining vulnerabilities:** ${{ env.VULN_COUNT_AFTER }}
            - **Status:** ${{ env.VULN_COUNT_AFTER == '0' && '✅ All fixed' || '⚠️ Partially fixed' }}

            ### Details

            Security advisories were found in the dependency tree. This PR updates dependencies to their latest secure versions.

            **⚠️ This is a security-related update and should be reviewed and merged promptly.**

            ### Review Checklist

            - [ ] Verify CI passes
            - [ ] Confirm security audit now passes
            - [ ] Check for any breaking changes
            - [ ] Deploy to production promptly after merge

            ---

            🔒 This is an automated security update. Please review and merge promptly.
          branch: "security/dependency-update-${{ github.run_number }}"
          delete-branch: true
          labels: |
            security
            dependencies
            high-priority
            automated

          add-paths: |
            threatflux-package-security/Cargo.toml
            threatflux-package-security/Cargo.lock
      - name: Create security issue if fixes incomplete
        if: env.SECURITY_UPDATES_NEEDED == 'true' && env.SECURITY_FIXES_APPLIED == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 SECURITY: Manual intervention required for vulnerability fixes',
              body: `## 🔒 Security Alert

              Automatic dependency updates could not resolve all security vulnerabilities.

              **Manual intervention is required.**

              ### Vulnerabilities Found

              ${process.env.VULN_COUNT} security vulnerabilities were detected that require manual resolution.

              ### Next Steps

              1. Review the security advisory details
              2. Manually update the affected dependencies
              3. Test for breaking changes
              4. Create a security update PR

              ### Resources

              - [Security Advisory Details](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              - [Cargo Audit Documentation](https://docs.rs/cargo-audit/)

              ---

              ⚠️ This issue was created automatically by the dependency update workflow.`,
              labels: ['security', 'high-priority', 'manual-intervention-required']
            });

      - name: Upload security reports
        if: env.SECURITY_UPDATES_NEEDED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-update-reports
          path: |
            threatflux-package-security/security-update-report.md
            threatflux-package-security/security-advisories.json
            threatflux-package-security/security-advisories-after.json
          retention-days: 90

    permissions:
      contents: write
      pull-requests: write
      issues: write
  # Node.js dependencies (if package.json exists)
  update-node-deps:
    name: Update Node.js Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check for package.json
        id: package-check
        run: |
          if [[ -f "package.json" ]]; then
            echo "package_json_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "package_json_exists=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found, skipping Node.js dependency updates"
          fi

      - name: Setup Node.js
        if: steps.package-check.outputs.package_json_exists == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Install npm-check-updates
        if: steps.package-check.outputs.package_json_exists == 'true'
        run: |
          npm install -g npm-check-updates@23.1.0


      - name: Check for Node.js updates
        if: steps.package-check.outputs.package_json_exists == 'true'
        run: |
          ncu --format group > node-updates.txt
          update_status=0
          ncu --errorLevel 2 || update_status=$?
          case "$update_status" in
            0) echo 'NODE_UPDATES_AVAILABLE=false' >> "$GITHUB_ENV" ;;
            2) echo 'NODE_UPDATES_AVAILABLE=true' >> "$GITHUB_ENV" ;;
            *) exit "$update_status" ;;
          esac

      - name: Apply Node.js updates
        if: steps.package-check.outputs.package_json_exists == 'true' && env.NODE_UPDATES_AVAILABLE == 'true'
        run: |
          ncu -u
          npm install
          {
            echo '# Node.js dependency update'
            echo '```'
            cat node-updates.txt
            echo '```'
          } > node-update-report.md

      - name: Create Node.js update PR
        if: steps.package-check.outputs.package_json_exists == 'true' && env.NODE_UPDATES_AVAILABLE == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Node.js dependencies"
          title: "chore(deps): Update Node.js dependencies"
          branch: "chore/node-dependency-update-${{ github.run_number }}"
          delete-branch: true
          labels: |
            dependencies
            nodejs
            automated

  # Cleanup old dependency update branches
          body-path: threatflux-package-security/node-update-report.md
          add-paths: |
            threatflux-package-security/package.json
            threatflux-package-security/package-lock.json
  cleanup-branches:
    name: Cleanup Old Update Branches
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old dependency branches
        run: |
          cutoff=$(date -d '30 days ago' +%s)
          git for-each-ref --merged=origin/main --format='%(refname:short) %(committerdate:unix)' refs/remotes/origin/chore/dependency-update- | while read -r branch timestamp; do
            if [ "$timestamp" -lt "$cutoff" ]; then git push origin --delete "${branch#origin/}"; fi
          done

  # Summary
  dependency-update-summary:
    name: Dependency Update Summary
    needs: [check-outdated, update-cargo-deps, security-updates, update-node-deps]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          {
            echo "# 📦 Dependency Update Summary"
            echo ""
            echo "**Run Date:** $(date)"
            echo "**Trigger:** ${WORKFLOW_VALUE_0}"
            echo ""
            echo "## Results"
            echo ""
            echo "| Task | Status | Notes |"
            echo "|------|--------|-------|"
            echo "| Outdated Check | ${WORKFLOW_VALUE_1} | ${WORKFLOW_VALUE_2} |"
            echo "| Cargo Updates | ${WORKFLOW_VALUE_3} | Rust dependencies |"
            echo "| Security Updates | ${WORKFLOW_VALUE_4} | Security-focused updates |"
            echo "| Node.js Updates | ${WORKFLOW_VALUE_5} | Node.js dependencies |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # Count successful updates
          SUCCESS_COUNT=0
          if [[ "${WORKFLOW_VALUE_1}" == "success" ]]; then ((SUCCESS_COUNT+=1)); fi
          if [[ "${WORKFLOW_VALUE_3}" == "success" ]]; then ((SUCCESS_COUNT+=1)); fi
          if [[ "${WORKFLOW_VALUE_4}" == "success" ]]; then ((SUCCESS_COUNT+=1)); fi
          if [[ "${WORKFLOW_VALUE_5}" == "success" ]]; then ((SUCCESS_COUNT+=1)); fi

          {
            echo "## Summary"
            echo ""
            echo "- ✅ Successful tasks: $SUCCESS_COUNT/4"
            echo "- 🔍 Dependencies checked: ${WORKFLOW_VALUE_6}"
            echo "- 🔒 Security status: Review the security update job and its advisory artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          WORKFLOW_VALUE_0: ${{ github.event_name }}
          WORKFLOW_VALUE_1: ${{ needs.check-outdated.result }}
          WORKFLOW_VALUE_2: ${{ needs.check-outdated.outputs.update_summary }}
          WORKFLOW_VALUE_3: ${{ needs.update-cargo-deps.result }}
          WORKFLOW_VALUE_4: ${{ needs.security-updates.result }}
          WORKFLOW_VALUE_5: ${{ needs.update-node-deps.result }}
          WORKFLOW_VALUE_6: ${{ needs.check-outdated.outputs.has_updates == 'true' && 'Updates found' || 'Up to date' }}
    defaults:
      run:
        working-directory: .
defaults:
  run:
    shell: bash
    working-directory: threatflux-package-security
