name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run security scans daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

  CARGO_TARGET_DIR: ${{ github.workspace }}/threatflux-package-security/target
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Rust security audit
  cargo-audit:
    name: Cargo Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: cargo-audit

          workspaces: threatflux-package-security -> target
      - name: Install cargo-audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2


      - name: Run security audit
        run: |
          audit_status=0
          python3 ../scripts/check-rsa-exception.py
          cargo audit --json > audit-results.json || audit_status=$?
          jq -e '.vulnerabilities.list | type == "array"' audit-results.json > /dev/null
          {
            echo '# Security Audit Report'
            echo "Generated on: $(date)"
            jq -r '.vulnerabilities.list[] | "- \(.advisory.id): \(.advisory.title)"' audit-results.json
          } > audit-report.md
          exit "$audit_status"

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-audit-results
          path: |
            threatflux-package-security/audit-results.json
            threatflux-package-security/audit-report.md
          retention-days: 30

        if: always()
      - name: Comment on PR (if vulnerabilities found)
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('threatflux-package-security/audit-report.md')) {
              const report = fs.readFileSync('threatflux-package-security/audit-report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔒 Security Audit Results\n\n${report}`
              });
            }

  # Dependency scanning with cargo-deny
  cargo-deny:
    name: Cargo Deny Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: cargo-deny

          workspaces: threatflux-package-security -> target
      - name: Install cargo-deny
        run: |
          cargo install cargo-deny --locked --version 0.20.2


      - name: Verify shared deny policy
        run: |-
          test -f ../deny.toml

      - name: Run cargo-deny
        run: |
          cargo deny --locked --manifest-path Cargo.toml --config ../deny.toml --all-features --log-level error check advisories licenses sources
          cargo deny --locked --manifest-path Cargo.toml --config ../deny.toml --all-features --log-level warn check bans

      - name: Generate deny report
        if: always()
        run: |
          {
            echo "# Dependency Analysis Report"
            echo "Generated on: $(date)"
            echo "The preceding cargo-deny step determines the job result."
          } > deny-report.md

      - name: Upload deny results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-deny-results
          path: |
            threatflux-package-security/deny-report.md
          retention-days: 30

  # CodeQL analysis
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - rust
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          config: |
            name: "Security Analysis"
            disable-default-queries: false
            queries:
              - security-and-quality
              - security-extended

          source-root: ${{ github.workspace }}/threatflux-package-security
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: codeql

          workspaces: threatflux-package-security -> target
      - name: Build for CodeQL
        run: |
          # Build the project for analysis
          cargo build --locked --all-features

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  # Semgrep static analysis
  semgrep-analysis:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

        run: |
          python3 -m venv "${RUNNER_TEMP}/semgrep"
          "${RUNNER_TEMP}/semgrep/bin/python" -m pip install "semgrep==1.179.0"
          "${RUNNER_TEMP}/semgrep/bin/semgrep" scan --config p/security-audit --config p/rust --config p/supply-chain --error --sarif --output semgrep.sarif .
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: threatflux-package-security/semgrep.sarif
          checkout_path: ${{ github.workspace }}/threatflux-package-security
        if: always()

  # Supply chain security
  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: supply-chain

          workspaces: threatflux-package-security -> target
      - name: Generate dependency tree
        run: |
          cargo tree --all-features --locked --format "{p} {l}" > dependency-tree.txt
          cargo tree --all-features --locked --duplicates > duplicate-deps.txt

      - name: Check for known malicious packages
        run: |
          # Create a basic check for known problematic crates
          {
            echo "# Supply Chain Security Report"
            echo ""
            echo "Generated on: $(date)"
            echo ""
          } > supply-chain-report.md
          # List of crates to watch for (example - expand as needed)
          WATCH_CRATES=("event-stream" "ua-parser-js" "lodash" "minimist")

          {
            echo "## Dependency Analysis"
            echo ""
          } >> supply-chain-report.md
          for crate in "${WATCH_CRATES[@]}"; do
            if grep -q "$crate" dependency-tree.txt; then
              echo "⚠️ Found potentially risky dependency: $crate" >> supply-chain-report.md
            fi
          done

          # Check for excessive dependencies
          DEP_COUNT=$(wc -l < dependency-tree.txt)
          echo "- Total dependencies: $DEP_COUNT" >> supply-chain-report.md

          if [[ $DEP_COUNT -gt 200 ]]; then
            echo "⚠️ High dependency count ($DEP_COUNT) - consider reducing" >> supply-chain-report.md
          fi

          {
            echo ""
            echo "## Duplicate Dependencies"
            echo '```'
            cat duplicate-deps.txt
            echo '```'
          } >> supply-chain-report.md

      - name: Upload supply chain report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: supply-chain-report
          path: |
            threatflux-package-security/supply-chain-report.md
            threatflux-package-security/dependency-tree.txt
            threatflux-package-security/duplicate-deps.txt
          retention-days: 30

  # Secrets scanning
  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks.tar.gz | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Create gitleaks config
        run: |
          cat > .gitleaks.toml << 'EOF'
          [extend]
          useDefault = true

          [[rules]]
          id = "rust-api-key"
          description = "Rust API key"
          regex = '''(?i)(rust|cargo)[_-]?(api|token)[_-]?key[_-]?[:=]\s*['\"]?([a-zA-Z0-9_-]{20,})['\"]?'''

          [[rules]]
          id = "generic-secret"
          description = "Generic secret"
          regex = '''(?i)(secret|password|token|key)[_-]?[:=]\s*['\"]?([a-zA-Z0-9_-]{16,})['\"]?'''

          [[rules]]
          id = "private-key"
          description = "Private key"
          regex = '''-----BEGIN [A-Z]+ PRIVATE KEY-----'''

          [allowlist]
          description = "Allowlisted files"
          files = [
              '''\.git/''',
              '''test.*\.rs$''',
              '''tests/.*\.rs$''',
              '''examples/.*\.rs$''',
          ]

          regexes = [
              '''test[_-]?(secret|password|token|key)''',
              '''example[_-]?(secret|password|token|key)''',
              '''fake[_-]?(secret|password|token|key)''',
              '''dummy[_-]?(secret|password|token|key)''',
          ]
          EOF

      - name: Run gitleaks scan
        run: |
          scan_status=0
          gitleaks git --config .gitleaks.toml --report-format json --report-path gitleaks-report.json --redact || scan_status=$?
          if [ "$scan_status" -gt 1 ]; then exit "$scan_status"; fi
          jq -e 'type == "array"' gitleaks-report.json > /dev/null
          findings=$(jq 'length' gitleaks-report.json)
          {
            echo '# Secrets Scanning Report'
            echo "Generated on: $(date)"
            echo "Potential secret findings: ${findings}; review the redacted JSON artifact."
          } > secrets-report.md
          if [ "$findings" -gt 0 ]; then
            echo 'SECRETS_FOUND=true' >> "$GITHUB_ENV"
          else
            echo 'SECRETS_FOUND=false' >> "$GITHUB_ENV"
          fi

      - name: Upload secrets scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: secrets-scan-results
          path: |
            threatflux-package-security/gitleaks-report.json
            threatflux-package-security/secrets-report.md
          retention-days: 30

        if: always()
      - name: Fail if secrets found
        run: |
          test "$SECRETS_FOUND" = false


  # Security summary
  security-summary:
    name: Security Summary
    needs: [cargo-audit, cargo-deny, codeql-analysis, semgrep-analysis, supply-chain-security, secrets-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all security reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          merge-multiple: true

          path: threatflux-package-security/
      - name: Generate security summary
        run: |
          {
            echo "# 🔒 Security Analysis Summary"
            echo ""
            echo "**Analysis Date:** $(date)"
            echo ""
            echo "## Results Overview"
            echo ""
            echo "| Check | Status | Details |"
            echo "|-------|--------|---------|"
            echo "| Cargo Audit | ${WORKFLOW_VALUE_0} | Rust security advisories |"
            echo "| Cargo Deny | ${WORKFLOW_VALUE_1} | License and dependency validation |"
            echo "| CodeQL | ${WORKFLOW_VALUE_2} | Static code analysis |"
            echo "| Semgrep | ${WORKFLOW_VALUE_3} | Security pattern detection |"
            echo "| Supply Chain | ${WORKFLOW_VALUE_4} | Dependency security |"
            echo "| Secrets Scan | ${WORKFLOW_VALUE_5} | Secret detection |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # Count failures
          FAILED_CHECKS=0
          [[ "${WORKFLOW_VALUE_0}" == "failure" ]] && ((FAILED_CHECKS+=1))
          [[ "${WORKFLOW_VALUE_1}" == "failure" ]] && ((FAILED_CHECKS+=1))
          [[ "${WORKFLOW_VALUE_2}" == "failure" ]] && ((FAILED_CHECKS+=1))
          [[ "${WORKFLOW_VALUE_3}" == "failure" ]] && ((FAILED_CHECKS+=1))
          [[ "${WORKFLOW_VALUE_4}" == "failure" ]] && ((FAILED_CHECKS+=1))
          [[ "${WORKFLOW_VALUE_5}" == "failure" ]] && ((FAILED_CHECKS+=1))

          if [[ $FAILED_CHECKS -eq 0 ]]; then
            {
              echo "## ✅ Security Status: PASS"
              echo ""
              echo "All security checks passed successfully!"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ❌ Security Status: ATTENTION REQUIRED"
              echo ""
              echo "**$FAILED_CHECKS security check(s) require attention.**"
              echo ""
              echo "Please review the failed checks and address any security concerns."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "## 📋 Available Reports"
            echo ""
            echo "Security reports are available as workflow artifacts:"
            echo "- 🔍 Cargo Audit Results"
            echo "- 📋 Cargo Deny Analysis"
            echo "- 🔗 Supply Chain Report"
            echo "- 🔐 Secrets Scan Results"
          } >> "$GITHUB_STEP_SUMMARY"

        env:
          WORKFLOW_VALUE_0: ${{ needs.cargo-audit.result }}
          WORKFLOW_VALUE_1: ${{ needs.cargo-deny.result }}
          WORKFLOW_VALUE_2: ${{ needs.codeql-analysis.result }}
          WORKFLOW_VALUE_3: ${{ needs.semgrep-analysis.result }}
          WORKFLOW_VALUE_4: ${{ needs.supply-chain-security.result }}
          WORKFLOW_VALUE_5: ${{ needs.secrets-scan.result }}
      - name: Create security badge
        run: |
          if [[ $FAILED_CHECKS -eq 0 ]]; then
            {
              echo "SECURITY_STATUS=passing"
              echo "SECURITY_COLOR=brightgreen"
            } >> "$GITHUB_ENV"
          else
            {
              echo "SECURITY_STATUS=attention"
              echo "SECURITY_COLOR=orange"
            } >> "$GITHUB_ENV"
          fi
defaults:
  run:
    shell: bash
    working-directory: threatflux-package-security
