name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

  CARGO_TARGET_DIR: ${{ github.workspace }}/threatflux-package-security/target
jobs:
  # Fast checks that run first to provide quick feedback
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          components: rustfmt, clippy

          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: quick-checks

          workspaces: threatflux-package-security -> target
      - name: Check formatting
        run: |
          cargo fmt --all -- --check


      - name: Check clippy (deny warnings)
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings


      - name: Check documentation
        run: |
          cargo doc --locked --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Comprehensive testing across platforms and Rust versions
  test:
    name: Test Suite
    needs: quick-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust:                        # MSRV
          - 1.99.0
          - beta
          - 1.97.1
        include:
          - os: ubuntu-latest
            rust: nightly
            experimental: true

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Verify selected Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: test-${{ matrix.os }}-${{ matrix.rust }}

          workspaces: threatflux-package-security -> target
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install pkg-config openssl

      - name: Build library
        run: |
          cargo build --locked --all-features


      - name: Run library tests
        run: |
          cargo test --locked --all-features --verbose


      - name: Run doctests
        run: |
          cargo test --locked --doc --all-features


  # Feature testing
  feature-tests:
    name: Feature Tests
    needs: quick-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - concurrent
          - offline
          - concurrent,offline
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: feature-test-${{ matrix.features }}

          workspaces: threatflux-package-security -> target
      - name: Test with features
        run: |
          cargo test --locked --no-default-features --features "${WORKFLOW_VALUE_0}" --verbose


  # Integration testing
        env:
          WORKFLOW_VALUE_0: ${{ matrix.features }}
  integration-tests:
    name: Integration Tests
    needs: [test, feature-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: integration-tests

          workspaces: threatflux-package-security -> target
      - name: Run integration tests
        run: |
          cargo test --locked --test integration_test --all-features --verbose


      - name: Run comprehensive tests
        run: |
          cargo test --locked --test comprehensive_test --all-features --verbose


  # Performance benchmarks
  benchmarks:
    name: Performance Benchmarks
    needs: quick-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: benchmarks

          workspaces: threatflux-package-security -> target
      - name: Run benchmarks
        run: |
          cargo bench --all-features --locked 2>&1 | tee benchmark_results.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: |
            threatflux-package-security/benchmark_results.txt
          if-no-files-found: ignore

  # Code coverage
  coverage:
    name: Code Coverage
    needs: quick-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          components: llvm-tools-preview

          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: coverage

          workspaces: threatflux-package-security -> target
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0  # v2.87.24
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Generate coverage report
        run: |
          cargo llvm-cov --locked --all-features --lcov --output-path lcov.info


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: threatflux-package-security/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

          version: v11.3.1

  # Library verification across platforms
  cross-platform-verify:
    name: Cross-Platform Verification
    needs: [test, integration-tests]
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          targets: ${{ matrix.target }}

          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: verify-${{ matrix.target }}

          workspaces: threatflux-package-security -> target
      - name: Check library builds for target
        run: |
          cargo check --locked --target "${WORKFLOW_VALUE_0}" --all-features


        env:
          WORKFLOW_VALUE_0: ${{ matrix.target }}
      - name: Run tests for target (if native)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-apple-darwin'
        run: |
          cargo test --locked --target "${WORKFLOW_VALUE_0}" --all-features


  # Final status check
        env:
          WORKFLOW_VALUE_0: ${{ matrix.target }}
  ci-success:
    name: CI Success
    needs:
      - quick-checks
      - test
      - feature-tests
      - integration-tests
      - coverage
      - cross-platform-verify
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all jobs success
        run: |
          if [[ "${WORKFLOW_VALUE_0}" != "success" ]]; then
            echo "Quick checks failed"
            exit 1
          fi
          if [[ "${WORKFLOW_VALUE_1}" != "success" ]]; then
            echo "Tests failed"
            exit 1
          fi
          if [[ "${WORKFLOW_VALUE_2}" != "success" ]]; then
            echo "Feature tests failed"
            exit 1
          fi
          if [[ "${WORKFLOW_VALUE_3}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${WORKFLOW_VALUE_4}" != "success" ]]; then
            echo "Cross-platform verification failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
        env:
          WORKFLOW_VALUE_0: ${{ needs.quick-checks.result }}
          WORKFLOW_VALUE_1: ${{ needs.test.result }}
          WORKFLOW_VALUE_2: ${{ needs.feature-tests.result }}
          WORKFLOW_VALUE_3: ${{ needs.integration-tests.result }}
          WORKFLOW_VALUE_4: ${{ needs.cross-platform-verify.result }}
    defaults:
      run:
        working-directory: .
defaults:
  run:
    shell: bash
    working-directory: threatflux-package-security
