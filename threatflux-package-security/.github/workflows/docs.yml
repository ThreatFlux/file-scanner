name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'file-scanner-*/**'
      - 'Cargo.toml'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'file-scanner-*/**'
      - 'Cargo.toml'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

  CARGO_TARGET_DIR: ${{ github.workspace }}/threatflux-package-security/target
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build Rust documentation
  build-rust-docs:
    name: Build Rust Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: docs

          workspaces: threatflux-package-security -> target
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build documentation
        run: |
          cargo doc --locked --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: >-
            -D warnings

      - name: Add index page
        run: |
          cat > target/doc/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>ThreatFlux Package Security Library Documentation</title>
              <meta http-equiv="refresh" content="0; url=threatflux_package_security/index.html">
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  .container { max-width: 800px; margin: 0 auto; }
                  .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 20px 0; }
                  .module-card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; }
                  .module-card h3 { margin-top: 0; color: #2d5aa0; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>ThreatFlux Package Security Library Documentation</h1>
                  <p>Unified package security analysis framework for multiple package managers.</p>

                  <h2>Main Documentation</h2>
                  <p><a href="threatflux_package_security/index.html">📖 Library Documentation</a></p>

                  <h2>Core Modules</h2>
                  <div class="module-grid">
                      <div class="module-card">
                          <h3>🔍 Analyzers</h3>
                          <p>Package-specific analysis engines for NPM, Python, and Java ecosystems</p>
                      </div>
                      <div class="module-card">
                          <h3>🏗️ Core Types</h3>
                          <p>Shared data structures and core functionality for package analysis</p>
                      </div>
                      <div class="module-card">
                          <h3>🔧 Utilities</h3>
                          <p>Common utilities for pattern matching, version parsing, and typosquatting detection</p>
                      </div>
                      <div class="module-card">
                          <h3>🛡️ Vulnerability Database</h3>
                          <p>Comprehensive vulnerability database with auto-update capabilities</p>
                      </div>
                  </div>

                  <h2>Features</h2>
                  <ul>
                      <li>🔍 NPM package security analysis and vulnerability detection</li>
                      <li>🐍 Python package security analysis with setup.py risk assessment</li>
                      <li>☕ Java package analysis and vulnerability scanning</li>
                      <li>🎭 Typosquatting detection across all package ecosystems</li>
                      <li>🔗 Supply chain security assessment</li>
                      <li>⚡ Async processing for high performance</li>
                  </ul>

                  <h2>Additional Resources</h2>
                  <ul>
                      <li><a href="https://github.com/ThreatFlux/threatflux-package-security">🔗 GitHub Repository</a></li>
                      <li><a href="https://github.com/ThreatFlux/threatflux-package-security/releases">📦 Releases</a></li>
                      <li><a href="https://github.com/ThreatFlux/threatflux-package-security/issues">🐛 Issues</a></li>
                      <li><a href="https://crates.io/crates/threatflux-package-security">📦 Crates.io</a></li>
                  </ul>
              </div>
          </body>
          </html>
          EOF

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rust-docs
          path: |
            threatflux-package-security/target/doc/
          retention-days: 30

  # Build additional documentation
  build-additional-docs:
    name: Build Additional Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Create docs directory
        run: |
          mkdir -p docs/generated


      - name: Generate library examples
        run: |
          # Generate library usage examples
          {
            echo "# Library Usage Examples"
            echo ""
          } > docs/generated/examples.md
          # Check if examples exist
          if [[ -d "examples" ]]; then
            for example in examples/*.rs; do
              if [[ -f "$example" ]]; then
                {
                  echo "## $(basename "$example" .rs)"
                  echo '```rust'
                  cat "$example"
                  echo '```'
                  echo ""
                } >> docs/generated/examples.md
              fi
            done
          else
            echo "No examples directory found" >> docs/generated/examples.md
          fi

      - name: Create documentation index
        run: |
          cat > docs/index.md << 'EOF'
          # ThreatFlux Package Security Library Documentation

          Welcome to the comprehensive documentation for the ThreatFlux Package Security Library.

          ## Quick Start

          Add the library to your `Cargo.toml`:

          ```toml
          [dependencies]
          threatflux-package-security = "0.1"
          ```

          Basic usage:

          ```rust
          use threatflux_package_security::analyzers::npm::NpmAnalyzer;
          use std::path::Path;

          #[tokio::main]
          async fn main() -> anyhow::Result<()> {
              let analyzer = NpmAnalyzer::new();
              let result = analyzer.analyze_package(Path::new("./package.json")).await?;
              println!("Analysis: {:#?}", result);
              Ok(())
          }
          ```

          ## Documentation Sections

          - [🦀 Rust API Documentation](../rust-docs/index.html) - Complete API reference
          - [📚 Library Examples](examples.html) - Code examples and usage patterns
          - [🏗️ Architecture](architecture.html) - Library design and module structure
          - [🧪 Testing](testing.html) - Test coverage and validation

          ## Features

          - **NPM Security**: Comprehensive NPM package vulnerability detection
          - **Python Security**: Python package analysis with setup.py risk assessment
          - **Java Security**: Java package analysis and vulnerability scanning
          - **Typosquatting Detection**: Advanced detection across all package ecosystems
          - **Supply Chain Security**: Complete supply chain risk assessment
          - **Vulnerability Database**: Auto-updating vulnerability database with CVE integration
          - **Performance**: Async processing for high-performance analysis
          - **Extensible**: Modular design for easy extension to new package managers

          ## Installation

          ### From Crates.io

          ```bash
          cargo add threatflux-package-security
          ```

          ### From Source

          ```bash
          git clone https://github.com/ThreatFlux/threatflux-package-security.git
          cd threatflux-package-security
          cargo build --locked --release
          ```

          ### Features

          - `concurrent` (default): Enable concurrent analysis capabilities
          - `offline`: Disable online vulnerability database updates

          ```toml
          [dependencies]
          threatflux-package-security = { version = "0.1", features = ["concurrent", "offline"] }
          ```

          ## License

          This project is dual-licensed under MIT OR Apache-2.0.
          EOF

      - name: Upload additional docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: additional-docs
          path: |
            threatflux-package-security/docs/
          retention-days: 30

  # Check documentation quality
  doc-quality-check:
    name: Documentation Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: 1.99.0
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: threatflux-package-security -> target
      - name: Check for missing docs
        run: |
          cargo doc --locked --all-features --document-private-items 2>&1 | tee doc_output.log

          # Check for warnings about missing documentation
          if grep -q "warning: missing documentation" doc_output.log; then
            echo "⚠️ Found missing documentation warnings:"
            grep "warning: missing documentation" doc_output.log
            echo ""
            echo "Consider adding documentation to improve code quality."
          else
            echo "✅ No missing documentation warnings found"
          fi

      - name: Check documentation links
        run: |
          # Basic link checking for README and documentation files
          find . -name "*.md" -exec echo "Checking {}" \; -exec grep -n "http" {} \; || true

      - name: Generate documentation report
        run: |
          cargo doc --all-features --locked --document-private-items 2>&1 | tee doc_report_build.log
          DOC_COUNT=$(awk '/Documenting/ {n++} END {print n+0}' doc_report_build.log)
          EXAMPLE_COUNT=$(find . -name '*.rs' -exec grep -l '```' {} \; | wc -l)
          {
            echo '# Documentation Quality Report'
            echo "Generated on: $(date)"
            echo "- Documented library: $DOC_COUNT"
            echo "- Files with code examples: $EXAMPLE_COUNT"
            if [ -f README.md ]; then echo "- README.md lines: $(wc -l < README.md)"; fi
            echo '## Build Log'
            echo '```'
            cat doc_report_build.log
            echo '```'
          } > doc_report.md

      - name: Upload quality report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: doc-quality-report
          path: |
            threatflux-package-security/doc_report.md
          retention-days: 30

  # Deploy to GitHub Pages (only on main branch push)
  deploy-docs:
    name: Deploy Documentation
    needs: [build-rust-docs, build-additional-docs, doc-quality-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Download Rust docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rust-docs
          path: threatflux-package-security/docs-site/rust-docs/

      - name: Download additional docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: additional-docs
          path: threatflux-package-security/docs-site/

      - name: Create site structure
        run: |
          # Create main index file that redirects to docs
          cat > docs-site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>ThreatFlux File Scanner</title>
              <meta http-equiv="refresh" content="0; url=rust-docs/index.html">
              <style>
                  body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
                  .container { max-width: 600px; margin: 0 auto; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>ThreatFlux File Scanner</h1>
                  <p>Redirecting to documentation...</p>
                  <p><a href="rust-docs/index.html">📖 View Documentation</a></p>
              </div>
          </body>
          </html>
          EOF

          # Ensure all files are present
          find docs-site -type f -name "*.html" | sed -n '1,10p'

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: threatflux-package-security/docs-site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
  docs-summary:
    name: Documentation Summary
    needs: [build-rust-docs, build-additional-docs, doc-quality-check, deploy-docs]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Documentation Summary
        run: |
          {
            echo "# Documentation Build Summary"
            echo ""
            echo "**Rust Docs:** ${WORKFLOW_VALUE_0}"
            echo "**Additional Docs:** ${WORKFLOW_VALUE_1}"
            echo "**Quality Check:** ${WORKFLOW_VALUE_2}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${WORKFLOW_VALUE_3}" != "skipped" ]]; then
            echo "**Deployment:** ${WORKFLOW_VALUE_3}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "${WORKFLOW_VALUE_3}" == "success" ]]; then
              {
                echo ""
                echo "📚 **Documentation available at:** https://${WORKFLOW_VALUE_4}.github.io/${WORKFLOW_VALUE_5#*/}/"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "**Deployment:** Skipped (not main branch)" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "### Quick Links"
            echo "- 🦀 [Rust API Docs](https://${WORKFLOW_VALUE_4}.github.io/${WORKFLOW_VALUE_5#*/}/rust-docs/)"
            echo "- 📖 [Main Documentation](https://${WORKFLOW_VALUE_4}.github.io/${WORKFLOW_VALUE_5#*/}/)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          WORKFLOW_VALUE_0: ${{ needs.build-rust-docs.result }}
          WORKFLOW_VALUE_1: ${{ needs.build-additional-docs.result }}
          WORKFLOW_VALUE_2: ${{ needs.doc-quality-check.result }}
          WORKFLOW_VALUE_3: ${{ needs.deploy-docs.result }}
          WORKFLOW_VALUE_4: ${{ github.repository_owner }}
          WORKFLOW_VALUE_5: ${{ github.repository }}
    defaults:
      run:
        working-directory: .
defaults:
  run:
    shell: bash
    working-directory: threatflux-package-security
